apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediflow-backend
  namespace: mediflow-prod
  labels:
    app: mediflow-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mediflow-backend
  template:
    metadata:
      labels:
        app: mediflow-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/mediflowai/backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: mediflow-secrets
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mediflow-backend-svc
  namespace: mediflow-prod
spec:
  type: ClusterIP
  selector:
    app: mediflow-backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mediflow-backend-hpa
  namespace: mediflow-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mediflow-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
